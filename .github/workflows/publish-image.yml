name: Publish image

# Packages a published release as a container image and pushes it to Docker Hub,
# multi-arch and digest-attested.
#
# The image is built here rather than in the task-definitions repo because it
# serves two audiences: workflow tasks pin its digest, and anyone who would
# rather run the CLI in a sandbox than install it can `docker run` it. Building
# it beside the release also means its provenance attestation is signed by
# Sigstore's public instance, so `gh attestation verify` works for anyone —
# which is not true of the binaries, whose attestations come from the private
# build repo.
#
# arm64 is built because that second audience is people's laptops. The Dockerfile
# resolves the matching binary from TARGETARCH, and both Linux builds are
# published, so there is nothing per-architecture to maintain here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package, without the leading v (e.g. 0.1.0)."
        required: true
      latest:
        description: "Also move the latest tag. Leave off when rebuilding an older release."
        type: boolean
        default: false

permissions:
  contents: read
  # Required by attest-build-provenance.
  id-token: write
  attestations: write

concurrency:
  group: publish-image-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_ORGANIZATION }}/swale-cli

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # A release event carries the tag; a dispatch carries the version. Strip
      # the leading v once, here, so the Dockerfile and the tags agree.
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${TAG#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a semver version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Emulation for the arm64 leg. The build is a download and a copy, so the
      # cost of emulating it is small.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Log in to Docker Hub as the organization
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_ORGANIZATION_TOKEN }}

      # latest follows a published, non-prerelease release. A dispatch has to ask
      # for it, so rebuilding an old version cannot silently move it.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.latest }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A task definition pins the digest, never a tag, so the digest is the
      # output that matters and belongs where someone can copy it.
      - name: Report published digest
        run: |
          echo "Published ${IMAGE}@${DIGEST}"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in the referencing task definition's \`exec.image\`." >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
